interface:
  display_name: "Workbench"
  short_description: "Create evals, configure, run, inspect, improve, sync, and export Workbench benchmarks and candidates with workbench"
  default_prompt: "Use Workbench as a local-first benchmark CLI. Verify workbench is installed before using it; if it is missing, install @workbench-ai/workbench and stop cleanly if npm lacks registry access for the @workbench-ai scope. Normal eval, improve, open, runs, and candidates commands operate on a local Workbench project. Authenticate with workbench login for Workbench Cloud operations. Use WORKBENCH_API_URL only to override the server URL. benchmark.yaml owns tasks, environment, and grading; candidates/<name>/candidate.yaml owns how to run the candidate; candidates/<name>/files contains the mounted candidate files; optimizers/<name>.yaml owns edit paths and improve behavior. Candidate manifests do not declare benchmark or path. Default to rubric grading for qualitative scoring; use command grading only for deterministic checks, an existing scorer, or an explicitly requested programmatic grading contract. Environment Dockerfiles own task tools and should include ca-certificates when HTTPS tools are needed; adapter setup owns adapter CLI dependencies. Built-in adapters are codex, claude, pi, command, and rubric; custom local, npm, or git adapters can override built-in ids when their manifest id matches, and workbench adapters test validates or replays adapter fixtures locally. Run local candidates with workbench eval candidates/<name> and improve the current candidate with workbench improve. Start the local browser UI with workbench open --json --no-open and keep that process running while the page is in use. Public benchmarks are addressable as owner/name; use workbench clone, fetch, pull, push, and workbench cloud fork/star/unstar for remote collaboration. Hosted execution and hosted resource inspection live under workbench cloud, for example workbench cloud eval candidates/<name> --benchmark owner/name@v1 and workbench cloud improve candidates/<name> --base cand_123 --optimizer optimizers/<name>.yaml. Hosted commands return or print Workbench Cloud URLs; use their urls object first, and when an embedded browser is available navigate it to the relevant Workbench URL so the user can see it. Watched hosted commands are client-side polling only; stopping them does not cancel hosted runs; use workbench cloud runs cancel to stop a running hosted workflow."
