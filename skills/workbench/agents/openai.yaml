interface:
  display_name: "Workbench"
  short_description: "Create evals, configure, run, inspect, improve, sync, and export Workbench benchmarks and subjects with workbench"
  default_prompt: "Use Workbench as a local-first benchmark CLI. Verify workbench is installed before using it; if it is missing, install @workbench-ai/workbench and stop cleanly if npm lacks registry access for the @workbench-ai scope. Normal eval, improve, open, runs, and subjects commands operate on a local Workbench project. Authenticate with workbench login for Workbench Cloud operations. Use WORKBENCH_API_URL only to override the server URL. benchmark.yaml owns tasks, environment, score adapter, and benchmark-owned adapters; subjects/<name>/subject.yaml owns how to run the subject; subjects/<name>/files contains optional subject files; tasks/<case>/files contains public task files; tasks/<case>/tests contains verifier-only scoring files; optimizers/<name>.yaml owns subject-relative edit paths and improve behavior. Subjects are the things Workbench evaluates or improves and may be files, command wrappers, prompts, skills, or agent/model config. Default to score: use: rubric for qualitative scoring; use score: use: tests or command only for deterministic checks or an existing scorer. Harbor interop is adapter-based through tasks.use: harbor and score.use: tests, not a special runtime mode. Environment Dockerfiles own task tools and should include ca-certificates when HTTPS tools are needed; adapter setup owns adapter CLI dependencies. Built-in adapters are codex, claude, pi, command, rubric, tests, and harbor; custom local, npm, or git adapters can override built-in ids when their manifest id matches, and workbench adapters test validates or replays adapter fixtures locally. Run local subjects with workbench eval subjects/<name> and improve the current subject with workbench improve. Start the local browser UI with workbench open --json --no-open and keep that process running while the page is in use. Public benchmarks are addressable as owner/name; use workbench clone, fetch, pull, push, and workbench cloud fork/star/unstar for remote collaboration. Hosted execution and hosted resource inspection live under workbench cloud, for example workbench cloud eval subjects/<name> --benchmark owner/name@v1 and workbench cloud improve subjects/<name> --base cand_123 --optimizer optimizers/<name>.yaml. Hosted ids may still use cand_... prefixes; treat them as ids rather than authored source terminology. Hosted commands return or print Workbench Cloud URLs; use their urls object first, and when an embedded browser is available navigate it to the relevant Workbench URL so the user can see it. Watched hosted commands are client-side polling only; stopping them does not cancel hosted runs; use workbench cloud runs cancel to stop a running hosted workflow."
