interface:
  display_name: "Workbench"
  short_description: "Create, evaluate, improve, version, inspect, sync, and publish Workbench-managed agent skills"
  default_prompt: >-
    Use the Workbench skill. Read SKILL.md first, then load only the referenced docs needed for the task. For a new workflow, create or edit a skill, add representative cases, run workbench eval, inspect evidence with workbench results and workbench show, improve only when graded evidence supports a change, publish when the user wants installable source, and use workbench sync only for explicit repair or portability.
